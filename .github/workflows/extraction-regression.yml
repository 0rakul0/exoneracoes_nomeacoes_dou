name: Python extraction regression
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow requests beautifulsoup4 pypdf pypdfium2 truststore
      - name: Check syntax
        run: python -m compileall -q diarios_oficiais analise_temporal scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
